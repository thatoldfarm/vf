<!DOCTYPE html>
<html lang="en">
<head>
    <title>IronVault: Final Portal</title>
    <meta charset="utf-8" />
    <style>
        body { 
            background: #050505; color: #00ff41; 
            font-family: 'Courier New', monospace; 
            display: flex; flex-direction: column; 
            align-items: center; padding: 20px; 
        }
        #boot-log { 
            width: 750px; height: 350px; background: #000; 
            overflow-y: scroll; border: 1px solid #00ff41; 
            padding: 15px; font-size: 12px; margin-bottom: 20px; 
            color: #00ff41; box-shadow: inset 0 0 15px #002200; 
        }
        #launch-btn { 
            display: none; padding: 15px 40px; background: #00ff41; 
            color: #000; font-weight: bold; border: none; 
            cursor: pointer; letter-spacing: 2px;
            box-shadow: 0 0 20px #00ff41; font-family: 'Courier New', monospace;
        }
        #launch-btn:hover { background: #fff; box-shadow: 0 0 30px #fff; }
        .verified { color: #00ff41; font-weight: bold; }
        .err { color: #ff3333; font-weight: bold; }
    </style>
</head>
<body>

    <h1>IRON VAULT: PORTAL V2</h1>
    <div id="boot-log"></div>
    <button id="launch-btn" onclick="openPortal()">LAUNCH OS IN NEW TAB</button>

    <script type="module">
        const log = (msg, type = 'info') => {
            const div = document.getElementById("boot-log");
            div.innerHTML += `<span class="${type}">> ${msg}</span><br>`;
            div.scrollTop = div.scrollHeight;
        };

        // Global storage for the parent window
        window.vaultDNA = {};

        async function extractDNA(imgSrc) {
            log(`Opening Lattice: ${imgSrc}`);
            const response = await fetch(imgSrc);
            const blob = await response.blob();
            const img = await createImageBitmap(blob, { colorSpaceConversion: 'none' });
            
            const canvas = document.createElement('canvas');
            canvas.width = img.width; canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            
            const imgData = ctx.getImageData(0, 0, img.width, img.height).data;
            let rgb = new Uint8Array((imgData.length / 4) * 3);
            let idx = 0;
            for (let i = 0; i < imgData.length; i += 4) {
                rgb[idx++] = imgData[i]; rgb[idx++] = imgData[i+1]; rgb[idx++] = imgData[i+2];
            }

            let end = rgb.length - 1;
            while (end >= 0 && rgb[end] === 0) end--;
            const b64Len = new DataView(rgb.buffer, end - 3, 4).getUint32(0);
            const b64 = new TextDecoder().decode(rgb.slice(0, b64Len)).replace(/-/g, '+').replace(/_/g, '/');
            const binary = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
            
            const headerLen = new DataView(binary.buffer, 0, 4).getUint32(0);
            const metadata = JSON.parse(new TextDecoder().decode(binary.slice(4, 4 + headerLen)));
            
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            writer.write(binary.slice(4 + headerLen));
            writer.close();
            
            const output = [];
            const reader = ds.readable.getReader();
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                output.push(value);
            }
            const finalData = new Uint8Array(output.reduce((acc, curr) => acc + curr.length, 0));
            let offset = 0;
            for (const chunk of output) { finalData.set(chunk, offset); offset += chunk.length; }

            log(`Verified: ${metadata.filename}`, 'verified');
            return { data: finalData, name: metadata.filename };
        }

        async function init() {
            try {
                // Synthesize the DNA sequence
                window.vaultDNA.js = await extractDNA("MASTER_DNA_SEED_libv86.js.png");
                window.vaultDNA.wasm = await extractDNA("MASTER_DNA_SEED_v86.wasm.png");
                window.vaultDNA.bios = await extractDNA("MASTER_DNA_SEED_seabios.bin.png");
                window.vaultDNA.vga = await extractDNA("MASTER_DNA_SEED_vgabios.bin.png");
                window.vaultDNA.os = await extractDNA("MASTER_DNA_SEED_linuxV3.iso.png");

                log("DNA SYNTHESIS COMPLETE. READY FOR PORTAL.", 'verified');
                document.getElementById("launch-btn").style.display = "block";
            } catch (e) {
                log(`FATAL ERROR: ${e.message}`, 'err');
            }
        }

        window.openPortal = function() {
            // Open the new tab
            const portal = window.open("", "_blank");
            const dna = window.vaultDNA;

            // Write the Child UI
            const portalHTML = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>IronVault OS: Running</title>
                    <style>
                        body { 
                            background: #000; margin: 0; padding: 0; 
                            color: #00ff41; font-family: monospace; 
                            display: flex; flex-direction: column; 
                            align-items: center; justify-content: center; 
                            height: 100vh; width: 100vw; overflow: hidden;
                        }
                        #child-log { 
                            position: absolute; top: 0; left: 0; width: 100%; 
                            height: 50px; overflow-y: hidden; font-size: 11px; 
                            background: rgba(0,0,0,0.8); z-index: 100;
                            border-bottom: 1px solid #222; padding: 5px;
                        }
                        #screen_container { 
                            position: relative; 
                            border: 3px solid #333;
                            cursor: none; /* Hide real mouse to use OS mouse */
                        }
                        canvas { display: block; background: #000; }
                    </style>
                </head>
                <body>
                    <div id="child-log"></div>
                    <div id="screen_container"><canvas></canvas></div>
                    <script>
                        window.clog = (m) => { 
                            document.getElementById("child-log").innerHTML = "> " + m;
                        };
                    <\/script>
                </body>
                </html>
            `;
            portal.document.write(portalHTML);
            portal.document.close();

            // 1. Handover JS Engine via Blob URL
            const loadEngine = () => {
                portal.clog("Beaming Engine DNA...");
                const jsBlob = new portal.Blob([dna.js.data], { type: 'application/javascript' });
                const jsUrl = portal.URL.createObjectURL(jsBlob);
                
                const script = portal.document.createElement('script');
                script.src = jsUrl;
                script.onload = startBoot;
                portal.document.head.appendChild(script);
            };

            // 2. The Boot Sequence
            const startBoot = async () => {
                try {
                    portal.clog("Scanning child memory for Constructor...");
                    
                    let V86 = null;
                    for (let i = 0; i < 15; i++) {
                        // Scan all possible locations in the new tab's global space
                        V86 = portal.V86Starter || (portal.v86 && portal.v86.V86Starter);
                        if (!V86) {
                            for (let key in portal) {
                                if (key.toLowerCase().includes("v86") && typeof portal[key] === "function") {
                                    V86 = portal[key]; break;
                                }
                            }
                        }
                        if (V86) break;
                        await new Promise(r => setTimeout(r, 200));
                    }

                    if (!V86) throw new Error("V86 core not found in portal memory.");

                    portal.clog("Synthesizing hardware buffers...");
                    // Cast DNA into child's context
                    const cWasm = new portal.Uint8Array(dna.wasm.data);
                    const cBios = new portal.Uint8Array(dna.bios.data);
                    const cVga = new portal.Uint8Array(dna.vga.data);
                    const cOs = new portal.Uint8Array(dna.os.data);

                    const wasmUrl = portal.URL.createObjectURL(new portal.Blob([cWasm], {type:'application/wasm'}));
                    
                    const config = {
                        wasm_path: wasmUrl,
                        memory_size: 256 * 1024 * 1024,
                        vga_canvas: portal.document.querySelector("canvas"),
                        screen_container: portal.document.querySelector("#screen_container"),
                        bios: { buffer: cBios.buffer },
                        vga_bios: { buffer: cVga.buffer },
                        autostart: true,
                        // --- THE MOUSE FIXES ---
                        tablet_id: 1, // Forces absolute mouse coordinates (1:1 tracking)
                        preserve_aspect_ratio: true,
                        mouse_state: true
                    };

                    const osName = dna.os.name.toLowerCase();
                    if (osName.endsWith(".iso")) {
                        config.cdrom = { buffer: cOs.buffer };
                    } else {
                        // Logic for .img / .bin
                        if (cOs.length < 3145728) {
                            portal.clog("Mounting Floppy (FDA)...");
                            config.fda = { buffer: cOs.buffer };
                        } else {
                            portal.clog("Mounting Hard Drive (HDA)...");
                            config.hda = { buffer: cOs.buffer };
                        }
                    }

                    new V86(config);
                    portal.clog("OS Ignition Successful. Portal Active.");

                } catch (e) {
                    portal.clog("PORTAL ERROR: " + e.message);
                }
            };

            // Start delay
            setTimeout(loadEngine, 300);
        };

        // Start synthesis on page load
        init();
    </script>
</body>
</html>
